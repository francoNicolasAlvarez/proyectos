name: CI

on:
  push:
    branches: [main]
    paths: ["pedidos-plataforma/**"]
  pull_request:
    paths: ["pedidos-plataforma/**"]

defaults:
  run:
    working-directory: pedidos-plataforma

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pedidos-plataforma/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pasamanos/e2e exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

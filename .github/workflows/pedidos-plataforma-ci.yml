name: CI

on:
  push:
    branches: [main]
    paths: ["pedidos-plataforma/**"]
  pull_request:
    paths: ["pedidos-plataforma/**"]

defaults:
  run:
    working-directory: pedidos-plataforma

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pedidos-plataforma/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pasamanos/e2e exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Pruebas de concurrencia contra un PostgreSQL real con varias conexiones.
  # No bloqueante hasta que se verifique su primera ejecución (nunca corrió localmente).
  postgres-integration:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pasamanos
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pasamanos
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pedidos-plataforma/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pasamanos/api exec vitest run test/postgres.integration.test.ts
